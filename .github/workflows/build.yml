name: Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          CMAKE_VERSION=3.28.6
          CMAKE_DIR="cmake-${CMAKE_VERSION}-macos-universal"
          curl -sL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_DIR}.tar.gz" | tar xz
          xattr -dr com.apple.quarantine "${CMAKE_DIR}" 2>/dev/null || true
          echo "${CMAKE_DIR}/CMake.app/Contents/bin" >> $GITHUB_PATH

      - name: Build
        run: make build
